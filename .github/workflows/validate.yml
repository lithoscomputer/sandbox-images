name: Validate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check shell scripts
        run: shellcheck scripts/slim/install.sh scripts/full/capture-layer.sh tests/verify-docs.sh tests/verify-image.sh

      - name: Check image selection documentation
        run: tests/verify-docs.sh

      - name: Check JavaScript
        run: node --check scripts/full/registry.mjs

      - name: Test registry uploader
        run: node tests/registry-upload.mjs

      - name: Check executable files
        run: test -x scripts/slim/install.sh && test -x scripts/full/capture-layer.sh && test -x tests/verify-docs.sh && test -x tests/verify-image.sh

  dockerfile:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - ubuntu: "22.04"
            image_os: ubuntu22
          - ubuntu: "24.04"
            image_os: ubuntu24
          - ubuntu: "26.04"
            image_os: ubuntu26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Validate Ubuntu ${{ matrix.ubuntu }} build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.slim
          platforms: linux/amd64
          call: check
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu }}
            IMAGE_OS=${{ matrix.image_os }}
