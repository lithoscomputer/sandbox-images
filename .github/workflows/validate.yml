name: Validate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check shell scripts
        run: shellcheck scripts/image-aliases.sh scripts/slim/install.sh scripts/dind/install.sh scripts/dind/start-docker scripts/chrome/install.sh scripts/full/capture-layer.sh tests/image-aliases.sh tests/smoke-runtime.sh tests/verify-docs.sh tests/verify-image.sh

      - name: Test image aliases
        run: tests/image-aliases.sh

      - name: Check image selection documentation
        run: tests/verify-docs.sh

      - name: Check JavaScript
        run: node --check scripts/full/registry.mjs && node --check scripts/aliases/registry.mjs

      - name: Test registry uploader
        run: node tests/registry-upload.mjs

      - name: Test registry aliases
        run: node tests/registry-aliases.mjs

      - name: Check executable files
        run: test -x scripts/image-aliases.sh && test -x scripts/slim/install.sh && test -x scripts/dind/install.sh && test -x scripts/dind/start-docker && test -x scripts/chrome/install.sh && test -x scripts/full/capture-layer.sh && test -x tests/image-aliases.sh && test -x tests/smoke-runtime.sh && test -x tests/verify-docs.sh && test -x tests/verify-image.sh

  dockerfile:
    name: Dockerfile check (${{ matrix.ubuntu }} ${{ matrix.flavor }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - ubuntu: "22.04"
            image_os: ubuntu22
            flavor: slim
          - ubuntu: "24.04"
            image_os: ubuntu24
            flavor: slim
          - ubuntu: "24.04"
            image_os: ubuntu24
            flavor: dind
          - ubuntu: "24.04"
            image_os: ubuntu24
            flavor: chrome
          - ubuntu: "24.04"
            image_os: ubuntu24
            flavor: dind-chrome
          - ubuntu: "26.04"
            image_os: ubuntu26
            flavor: slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Validate Ubuntu ${{ matrix.ubuntu }} ${{ matrix.flavor }} build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.slim
          target: ${{ matrix.flavor }}
          platforms: linux/amd64
          call: check
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu }}
            IMAGE_OS=${{ matrix.image_os }}
