name: Capture full images

on:
  push:
    branches: [main]
    paths:
      - scripts/full/**
  schedule:
    # Runner images update weekly, but deployment can take several days.
    # Check daily and skip capture when the runner ImageVersion already exists.
    - cron: "47 8 * * *"
  workflow_dispatch:
    inputs:
      ubuntu:
        description: Ubuntu release to capture
        type: choice
        options: [all, "22.04", "24.04", "26.04"]
        default: all
      force:
        description: Capture even if this runner ImageVersion already exists
        type: boolean
        default: false

permissions: {}

concurrency:
  group: full-runner-capture
  cancel-in-progress: true

jobs:
  capture:
    name: Ubuntu ${{ matrix.ubuntu }} full (${{ matrix.architecture }})
    runs-on: ${{ format('ubuntu-{0}{1}', matrix.ubuntu, matrix.architecture == 'arm64' && '-arm' || '') }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write # Needed to publish images to GHCR
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        ubuntu: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.ubuntu != 'all' && format('["{0}"]', inputs.ubuntu) || '["22.04","24.04","26.04"]') }}
        architecture: [amd64, arm64]

    env:
      UBUNTU_VERSION: ${{ matrix.ubuntu }}
      ARCHITECTURE: ${{ matrix.architecture }}
      LAYER_METADATA_DIR: ${{ github.workspace }}/.layer-metadata
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # This must remain the only third-party code executed before capture.
      # The checkout directory is excluded from the image.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set target image
        id: target
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="$(sed -n -E 's/^ImageVersion="?([^"[:space:]]+)"?$/\1/p' /etc/environment)"
          test -n "$version"
          test "$(dpkg --print-architecture)" = "$ARCHITECTURE"
          echo "IMAGE=${owner}/ubuntu-${MATRIX_UBUNTU}-full" >>"$GITHUB_ENV"
          echo "IMAGE_VERSION=${version}" >>"$GITHUB_ENV"
        env:
          MATRIX_UBUNTU: ${{ matrix.ubuntu }}

      - name: Check for the runner version in GHCR
        id: existing
        run: node scripts/full/registry.mjs manifest-exists --tag "${IMAGE_VERSION}-${ARCHITECTURE}"

      - name: Capture root filesystem
        if: steps.existing.outputs.exists != 'true' || github.event_name == 'push' || inputs.force
        run: scripts/full/capture-layer.sh 00-root

      - name: Capture /usr/local
        if: steps.existing.outputs.exists != 'true' || github.event_name == 'push' || inputs.force
        run: scripts/full/capture-layer.sh 10-usr-local

      - name: Capture /opt
        if: steps.existing.outputs.exists != 'true' || github.event_name == 'push' || inputs.force
        run: scripts/full/capture-layer.sh 20-opt

      - name: Capture hosted tool cache
        if: steps.existing.outputs.exists != 'true' || github.event_name == 'push' || inputs.force
        run: scripts/full/capture-layer.sh 30-toolcache

      - name: Publish image manifest
        if: steps.existing.outputs.exists != 'true' || github.event_name == 'push' || inputs.force
        run: node scripts/full/registry.mjs publish --metadata-dir "$LAYER_METADATA_DIR"

      - name: Report unchanged image
        if: steps.existing.outputs.exists == 'true' && github.event_name != 'push' && !inputs.force
        run: echo "ghcr.io/${IMAGE}:${IMAGE_VERSION}-${ARCHITECTURE} already exists; capture skipped"

  publish:
    name: Publish Ubuntu ${{ matrix.ubuntu }} full index
    needs: capture
    runs-on: ubuntu-24.04
    permissions:
      packages: write # Needed to publish images to GHCR
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.ubuntu != 'all' && format('["{0}"]', inputs.ubuntu) || '["22.04","24.04","26.04"]') }}

    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble and verify image index
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/ubuntu-${MATRIX_UBUNTU}-full"
          docker buildx imagetools create \
            --tag "${image}:latest" \
            "${image}:latest-amd64" \
            "${image}:latest-arm64"

          index="$(docker buildx imagetools inspect "${image}:latest" --raw)"
          for architecture in amd64 arm64; do
            jq --exit-status \
              --arg architecture "$architecture" \
              'any(.manifests[]?; .platform.os == "linux" and .platform.architecture == $architecture)' \
              <<<"$index" >/dev/null
          done
        env:
          MATRIX_UBUNTU: ${{ matrix.ubuntu }}
