name: Sync full image aliases

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-full-aliases.yml
      - scripts/aliases/**
      - scripts/image-aliases.sh
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: full-image-aliases
  cancel-in-progress: true

jobs:
  sync:
    name: Ubuntu ${{ matrix.ubuntu }} full aliases
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # Needed to publish aliases to GHCR
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04", "26.04"]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image names
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          mapfile -t packages < <(
            scripts/image-aliases.sh "$owner" "$MATRIX_UBUNTU" full
          )
          {
            echo "IMAGE=${packages[0]}"
            echo 'IMAGE_ALIASES<<EOF'
            printf '%s\n' "${packages[@]:1}"
            echo 'EOF'
          } >>"$GITHUB_ENV"
        env:
          MATRIX_UBUNTU: ${{ matrix.ubuntu }}

      - name: Publish aliases from the canonical latest image
        run: >-
          node scripts/aliases/registry.mjs publish
          --source-tag latest
          --tags latest
          --include-version-tag
