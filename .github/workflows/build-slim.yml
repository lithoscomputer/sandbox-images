name: Build slim images

on:
  pull_request:
    paths:
      - .github/workflows/build-slim.yml
      - Dockerfile.slim
      - scripts/slim/**
      - tests/verify-image.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slim.yml
      - Dockerfile.slim
      - scripts/slim/**
      - tests/verify-image.sh
  schedule:
    # Daily at an off-peak minute. The build uses a 48-hour-old apt snapshot.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      ubuntu:
        description: Ubuntu release to build
        type: choice
        options: [all, "22.04", "24.04", "26.04"]
        default: all

permissions:
  contents: read
  packages: write

concurrency:
  group: slim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Ubuntu ${{ matrix.ubuntu }} slim
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.ubuntu != 'all' && format('["{0}"]', inputs.ubuntu) || '["22.04","24.04","26.04"]') }}

    steps:
      - uses: actions/checkout@v7

      - name: Set image metadata
        id: metadata
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/gha-ubuntu-${{ matrix.ubuntu }}-slim"
          snapshot="$(date -u -d '48 hours ago' '+%Y%m%dT000000Z')"
          created="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          short_sha="${GITHUB_SHA::12}"
          snapshot_date="${snapshot:0:8}"
          image_os="ubuntu${{ matrix.ubuntu }}"
          image_os="${image_os%%.*}"
          {
            echo "image=${image}"
            echo "snapshot=${snapshot}"
            echo "created=${created}"
            echo "short_sha=${short_sha}"
            echo "snapshot_date=${snapshot_date}"
            echo "image_os=${image_os}"
          } >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.slim
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu }}
            IMAGE_OS=${{ steps.metadata.outputs.image_os }}
            APT_SNAPSHOT=${{ steps.metadata.outputs.snapshot }}
            GITHUB_REPOSITORY=${{ github.repository }}
          tags: |
            ${{ steps.metadata.outputs.image }}:latest
            ${{ steps.metadata.outputs.image }}:snapshot-${{ steps.metadata.outputs.snapshot_date }}
            ${{ steps.metadata.outputs.image }}:sha-${{ steps.metadata.outputs.short_sha }}-snapshot-${{ steps.metadata.outputs.snapshot_date }}
          labels: |
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=slim-${{ matrix.ubuntu }}
          cache-to: type=gha,mode=max,scope=slim-${{ matrix.ubuntu }}
          provenance: mode=max
          sbom: true

      - name: Verify published image
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --volume "$PWD/tests:/tests:ro" \
            "${{ steps.metadata.outputs.image }}:sha-${{ steps.metadata.outputs.short_sha }}-snapshot-${{ steps.metadata.outputs.snapshot_date }}" \
            /tests/verify-image.sh "${{ matrix.ubuntu }}"
