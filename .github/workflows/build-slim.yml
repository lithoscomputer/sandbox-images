name: Build maintained images

on:
  pull_request:
    paths:
      - Dockerfile.slim
      - scripts/slim/**
      - scripts/dind/**
      - scripts/chrome/**
      - tests/verify-image.sh
      - tests/smoke-runtime.sh
  push:
    branches: [main]
    paths:
      - Dockerfile.slim
      - scripts/slim/**
      - scripts/dind/**
      - scripts/chrome/**
      - tests/verify-image.sh
      - tests/smoke-runtime.sh
  schedule:
    # Daily at an off-peak minute. The build uses a 48-hour-old apt snapshot.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      ubuntu:
        description: Ubuntu release to build
        type: choice
        options: [all, "22.04", "24.04", "26.04"]
        default: all
      flavor:
        description: Image flavor to build
        type: choice
        options: [all, slim, dind, chrome, dind-chrome]
        default: all

permissions: {}

concurrency:
  group: maintained-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Select images
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: matrix
        shell: bash
        run: |
          selected='[]'

          add_image() {
            ubuntu=$1
            image_os=$2
            flavor=$3

            if [[ "$INPUT_UBUNTU" != all && "$INPUT_UBUNTU" != "$ubuntu" ]]; then
              return
            fi
            if [[ "$INPUT_FLAVOR" != all && "$INPUT_FLAVOR" != "$flavor" ]]; then
              return
            fi

            selected="$(jq --compact-output \
              --arg ubuntu "$ubuntu" \
              --arg image_os "$image_os" \
              --arg flavor "$flavor" \
              '. + [{ubuntu: $ubuntu, image_os: $image_os, flavor: $flavor, target: $flavor}]' \
              <<<"$selected")"
          }

          add_image 22.04 ubuntu22 slim
          add_image 24.04 ubuntu24 slim
          add_image 24.04 ubuntu24 dind
          add_image 24.04 ubuntu24 chrome
          add_image 24.04 ubuntu24 dind-chrome
          add_image 26.04 ubuntu26 slim

          if [[ "$(jq length <<<"$selected")" -eq 0 ]]; then
            echo "The selected flavor is not available for Ubuntu $INPUT_UBUNTU" >&2
            exit 1
          fi
          echo "matrix={\"include\":${selected}}" >>"$GITHUB_OUTPUT"
        env:
          INPUT_UBUNTU: ${{ github.event_name == 'workflow_dispatch' && inputs.ubuntu || 'all' }}
          INPUT_FLAVOR: ${{ github.event_name == 'workflow_dispatch' && inputs.flavor || 'all' }}

  build:
    name: Ubuntu ${{ matrix.ubuntu }} ${{ matrix.flavor }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # Needed to publish images to GHCR
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image metadata
        id: metadata
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/ubuntu-${MATRIX_UBUNTU}"
          snapshot="$(date -u -d '48 hours ago' '+%Y%m%dT000000Z')"
          created="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          short_sha="${GITHUB_SHA::12}"
          {
            echo "image=${image}"
            echo "snapshot=${snapshot}"
            echo "created=${created}"
            echo "short_sha=${short_sha}"
            echo "tags=${image}:${MATRIX_FLAVOR}"
          } >>"$GITHUB_OUTPUT"
        env:
          MATRIX_UBUNTU: ${{ matrix.ubuntu }}
          MATRIX_FLAVOR: ${{ matrix.flavor }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.slim
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu }}
            IMAGE_OS=${{ matrix.image_os }}
            APT_SNAPSHOT=${{ steps.metadata.outputs.snapshot }}
            GITHUB_REPOSITORY=${{ github.repository }}
          tags: |
            ${{ steps.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: |
            type=gha,scope=image-${{ matrix.ubuntu }}-slim
            type=gha,scope=image-${{ matrix.ubuntu }}-${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.ubuntu }}-${{ matrix.flavor }}
          provenance: mode=max
          sbom: true

      - name: Publish immutable source tag
        if: github.event_name != 'pull_request'
        run: >-
          node scripts/registry/copy-image.mjs copy
          --source "${STEPS_METADATA_OUTPUTS_IMAGE}:${MATRIX_FLAVOR}"
          --target "${STEPS_METADATA_OUTPUTS_IMAGE}:${MATRIX_FLAVOR}-${STEPS_METADATA_OUTPUTS_SHORT_SHA}"
          --if-absent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_METADATA_OUTPUTS_IMAGE: ${{ steps.metadata.outputs.image }}
          STEPS_METADATA_OUTPUTS_SHORT_SHA: ${{ steps.metadata.outputs.short_sha }}
          MATRIX_FLAVOR: ${{ matrix.flavor }}

      - name: Verify published image
        if: github.event_name != 'pull_request'
        run: |
          canonical_ref="${STEPS_METADATA_OUTPUTS_IMAGE}:${MATRIX_FLAVOR}"
          docker run --rm \
            --platform linux/amd64 \
            --volume "$PWD/tests:/tests:ro" \
            "$canonical_ref" \
            /tests/verify-image.sh "${MATRIX_UBUNTU}" "${MATRIX_FLAVOR}"
        env:
          STEPS_METADATA_OUTPUTS_IMAGE: ${{ steps.metadata.outputs.image }}
          MATRIX_UBUNTU: ${{ matrix.ubuntu }}
          MATRIX_FLAVOR: ${{ matrix.flavor }}

      - name: Runtime smoke test
        if: github.event_name != 'pull_request' && matrix.flavor != 'slim'
        shell: bash
        run: |
          smoke_ref="${STEPS_METADATA_OUTPUTS_IMAGE}:${MATRIX_FLAVOR}"
          docker_args=(
            --rm
            --platform linux/amd64
            --volume "$PWD/tests:/tests:ro"
          )
          case "$MATRIX_FLAVOR" in
            dind) docker_args+=(--privileged) ;;
            chrome) docker_args+=(--shm-size=1g) ;;
            dind-chrome) docker_args+=(--privileged --shm-size=1g) ;;
          esac
          docker run "${docker_args[@]}" \
            "$smoke_ref" \
            /tests/smoke-runtime.sh "$MATRIX_FLAVOR"
        env:
          STEPS_METADATA_OUTPUTS_IMAGE: ${{ steps.metadata.outputs.image }}
          MATRIX_FLAVOR: ${{ matrix.flavor }}
